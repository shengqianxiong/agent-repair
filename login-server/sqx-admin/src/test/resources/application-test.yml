server:
  port: 9295
  servlet:
    context-path: /sqx_fast
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: login-server-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:login_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.sqx: warn
