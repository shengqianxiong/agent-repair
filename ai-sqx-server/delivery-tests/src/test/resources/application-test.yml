server:
  port: 0
  servlet:
    context-path: /sqx_fast

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bar_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.sqx: warn
