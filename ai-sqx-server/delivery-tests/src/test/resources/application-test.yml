server:
  port: 0
  servlet:
    context-path: /sqx_fast

spring:
  application:
    name: ai-sqx-server-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bar_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.sqx: warn
